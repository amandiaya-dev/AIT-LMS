{% extends "base.html" %}
{% block title %}New Attendance Session{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-1">New Attendance Session</h3>
    <p class="text-muted mb-4">Course: <strong>{{ course.title }}</strong></p>
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Session Title</label>{{ form.title }}{{ form.title.errors }}</div>
      <div class="mb-3"><label class="form-label">Date</label>{{ form.date }}{{ form.date.errors }}</div>
      <button type="submit" class="btn btn-primary">Create Session & Mark Attendance</button>
      <a href="{% url 'course_detail' course.pk %}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
